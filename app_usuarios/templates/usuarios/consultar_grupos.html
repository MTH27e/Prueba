
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4">Grupos registrados</h2>

        {% for grupo in grupos %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ grupo.name }}</h5>

                <p class="mb-2">Usuarios asignados:</p>

                <ul>
                    {% for usuario in grupo.user_set.all %}
                        <li>{{ usuario.username }}</li>
                    {% empty %}
                        <li>No hay usuarios asignados.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% empty %}
            <p>No hay grupos registrados.</p>
        {% endfor %}

        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
            Volver al panel
        </a>
    </div>

</body>
</html>
