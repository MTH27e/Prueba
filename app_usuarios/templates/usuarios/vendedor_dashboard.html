
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel del Vendedor</title>

    <link rel="icon" type="image/svg+xml"
          href="{% static 'app_usuarios/img/icono_vendedor.svg' %}">

    <link rel="stylesheet"
          href="{% static 'app_usuarios/css/estilos.css' %}">

    <script src="{% static 'app_usuarios/js/funciones.js' %}" defer></script>
</head>

<body>

    <main class="contenedor">

        <section class="panel">s

            <header class="panel-header">

                <div class="icono">
                    <img src="{% static 'app_usuarios/img/icono_vendedor.svg' %}"
                         alt="Icono de vendedor">
                </div>

                <h1>Panel del Vendedor</h1>

                <h2>Bienvenido, {{ request.user.username }}</h2>

                <p>
                    Desde este panel puedes consultar la cartelera
                    y acceder a las películas disponibles.
                </p>

            </header>

            <div class="opciones-panel">

                <a href="{% url 'cartelera:ver_peliculas' %}" class="boton">
                    Consultar cartelera
                </a>

            </div>

            <form action="{% url 'cerrar_sesion' %}" method="POST"
                  onsubmit="return confirmarCierre();">

                {% csrf_token %}

                <button type="submit" class="boton boton-salir">
                    Cerrar sesión
                </button>

            </form>

        </section>

    </main>

</body>
</html>
